name: CI

# The whole specification is checked on every push and pull request. The steps
# below are exactly `npm run ci`, decomposed so that a failure names the check
# that failed rather than the umbrella script that invoked it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository, so nothing here is
# granted permission to write to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification:
    name: Validate the specification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck the tooling and the test suite
        run: npm run typecheck

      - name: Validate the schemas, profiles, vectors and release metadata
        run: npm run validate

      - name: Check that the generated documentation is current
        run: npm run docs:check

      # `test:coverage` rather than `test`: the suite is the same, but this run also
      # enforces the floor configured in vitest.config.ts, so a module that loses its
      # tests fails here instead of quietly lowering a figure somebody has to notice.
      - name: Run the test suite with the coverage floor
        run: npm run test:coverage

  links:
    name: Documentation links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # `scripts/check-doc-links.py` already existed, and nothing ran it. It was listed in this
      # repository's own path filters, which made it look wired up in a search, while the job
      # that would have invoked it did not exist. Adding a screenshot to README.md is what
      # surfaced that: the check that should have guarded the new relative path was never
      # executed, so the path was unguarded and appeared to be covered.
      #
      # Stdlib only, so there is nothing to install and nothing to pin.
      - name: Check that every relative link in the documentation resolves
        run: python3 scripts/check-doc-links.py

  tests:
    name: Test on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The declared engine floor and the current release are both tested, so
        # that a specification tree that only works on one Node version is caught
        # before a contributor on the other one hits it.
        node: ["22.12", "24.x"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `test:coverage` rather than `test`: the suite is the same, but this run also
      # enforces the floor configured in vitest.config.ts, so a module that loses its
      # tests fails here instead of quietly lowering a figure somebody has to notice.
      - name: Run the test suite with the coverage floor
        run: npm run test:coverage
