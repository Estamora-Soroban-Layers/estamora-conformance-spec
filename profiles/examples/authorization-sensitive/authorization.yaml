# yaml-language-server: $schema=../../../schema/authorization.schema.json
authorization_rules:
  - id: owner-authorizes-spend
    summary: A spend must be authorized by the account it debits.
    description: >-
      The rule names three outcomes. An authorized caller succeeds; a caller
      presenting no authorization is rejected as missing authorization; a caller
      presenting valid authorization belonging to another account is rejected as a
      wrong actor. The last two are separate so that a contract which verifies only
      that some signature is present is identified rather than passing.
    methods:
      - spend
    actor:
      kind: argument
      argument: from
      on_behalf_of: false
    coverage:
      mode: exact
      arguments:
        - from
    unauthorized:
      kind: fail
      failure: missing-spend-signature
    wrong_actor:
      kind: fail
      failure: wrong-spend-actor
    replay_sensitive: true
    notes:
      - >-
        `on_behalf_of` is false because the debited account is also the account
        whose authority is required. A delegated spend would set it true and would
        need its own rule naming both principals, because the profile would then
        have to state which of them must sign.
      - >-
        Coverage is `exact` over `from` alone. `amount` stays outside the
        authorization envelope: requiring the quantity to be signed would make the
        authorization valid for one amount only, and the interface states a limit
        on the account rather than on the instruction.
      - >-
        The rule is replay sensitive. A spend reduces a balance, so a repeated
        invocation that is accepted moves value twice, and a contract that accepts
        it without the caller intending it has a defect this profile is entitled to
        report.

  - id: limit-requires-no-authorization
    summary: Reading an available balance must be possible without authorization.
    description: >-
      The rule exists so that the absence of an authorization requirement is a
      stated decision rather than an omission. A contract that demands
      authorization to read a balance fails this rule, and that failure is
      distinguishable from a contract that simply declared nothing. The
      authorization model requires every method to be governed by a rule, so a
      method with no actor needs a rule that says so.
    methods:
      - limit
    actor:
      kind: none
    coverage:
      # `at_most` with an empty argument set encodes "the contract must not demand
      # authorization over any argument". `exact` is reserved for a rule that names
      # the arguments its actor must cover.
      mode: at_most
      arguments: []
    unauthorized:
      kind: succeed
    wrong_actor:
      kind: succeed
    replay_sensitive: false
    notes:
      - >-
        Both rejection outcomes are `succeed` because there is no authorization to
        reject: with no actor in play there is no principal whose signature could
        be missing or belong to the wrong account.
